# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Unit-distance graphs of dimension four with nine edges"
  description: >-
    A graph of dimension four with nine edges and no isolated vertex is isomorphic to K_{3,3}:
    the extremal half of Erdős problem 1007, following Chaffee and Noble's proof of House's
    theorem.
  authors:
    - "Dishant Shah"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dishant Shah"

classification:
  arxiv: ["math.CO", "math.MG"]
  msc2020: ["05C62", "52C10"]

sources:
  - title: "Dimension 4 and dimension 5 graphs with minimum edge set"
    authors:
      - "Joe Chaffee"
      - "Matt Noble"
    id: "https://ajc.maths.uq.edu.au/pdf/64/ajc_v64_p327.pdf"
    type: "paper"
    location: "Australasian Journal of Combinatorics 64(2) (2016), 327-333, Theorem 7"
    relationship: "formalizes"
    note: >-
      The published proof this formalization certifies. Cited at its exact pinpoint, not at the
      paper as a whole.
  - title: "Formal Conjectures"
    authors:
      - "The Formal Conjectures Authors"
    id: "https://github.com/google-deepmind/formal-conjectures"
    type: "other"
    location: "FormalConjectures/ErdosProblems/1007.lean, declaration erdos_1007.variants.dimension_four_extremal"
    relationship: "background"
    note: >-
      The formal statement originates here and carries that project's review. Any deviation from
      the upstream statement is recorded under `limitations` below.

automation:
  # Declared honestly on every entry from this workspace. Only 3 of Palomar's first 36 entries
  # disclosed AI assistance; understating it would make the registry less useful than it should be.
  methods:
    - "AI-assisted"
  detail: >-
    The formal statement reproduces a declaration of google-deepmind/formal-conjectures, which
    carries that project's own review, with its two supporting definitions inlined so the file
    depends on Mathlib alone. The inlining was done by Claude Opus 5 and expands a notation to
    its definition without other change. An adversarial review of the inlined statement was run
    on gpt-5.6-sol; its findings are in docs/red-team-2026-09-20.md. Candidate selection was
    assisted by zai/glm-5.3-flash; retrieval receipts are in ../../docs/triage-results.md. The
    proof of DimensionFourExtremal, its witness, and both separating examples was produced by
    Grok 4.7 workers, with Claude Opus 5.5 recorded on the landing commit 6de7090. The three
    hypothesis-drop companions and their counterexamples were added by Grok 4.7. See AGENTS.md
    and ../../docs/PLAYBOOK.md.

limitations: >-
  The certified statement is Chaffee–Noble Theorem 7 for dimension four: a graph of dimension
  four with nine edges and no isolated vertex is isomorphic to K_{3,3}. The dimension-five half
  of the same paper is not formalized. Each of the three hypotheses is necessary. The
  counterexamples are proved: nine disjoint edges on eighteen vertices; K_{3,3} plus one edge
  inside a part; K_{3,3} plus an isolated vertex on seven vertices. Comparator has not been run.

review:
  status: "in-progress"
  note: >-
    The extremal statement, its witness, both separating examples, and the three hypothesis-drop
    counterexamples are proved in Lean. The Compass sign-off is void until the owner confirms
    again: UnitDistanceEmbeddable.separating changed at 6de7090. Comparator is pending. Palomar,
    the formal_proof pull request, the Mathlib pull request, and the writeup are not done.
